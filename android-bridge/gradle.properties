org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# o daemon do Kotlin não sobe nesta box (memória apertada): compila no mesmo processo
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Machine-specific settings (like the aapt2 override on ARM) belong in
# ~/.gradle/gradle.properties, not here: this file travels with the repo.
