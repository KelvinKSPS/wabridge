org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# o daemon do Kotlin não sobe nesta box (memória apertada): compila no mesmo processo
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Esta board e ARM64 e o aapt2 do SDK e x86-64: roda via qemu.
# Wrapper criado por scripts/setup-x86-aapt2.sh
android.aapt2FromMavenOverride=/home/orangepi/.local/bin/aapt2
