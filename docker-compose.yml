# Evolution API: the WhatsApp side of the bridge.
#
#   docker compose up -d
#
# Management UI (QR to pair): http://192.168.15.100:8098/manager
# API docs: http://192.168.15.100:8098/docs
#
# The global webhook already points to the bridge:
#   http://192.168.15.100:8097/webhook/whatsapp
# and the server talks to Evolution at EVOLUTION_API_URL (server/.env).

services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: wabridge-evolution
    restart: unless-stopped
    ports:
      # host 8098 -> container 8080 (host port 8080 is used by qbittorrent)
      - "8098:8080"
    environment:
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://192.168.15.100:8098
      SERVER_DISABLE_DOCS: "false"
      SERVER_DISABLE_MANAGER: "false"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN,INFO
      TELEMETRY_ENABLED: "false"
      # authentication
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-wabridge-dev}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      # Evolution counts each QR generated and refuses pairing at the limit
      # (the default is 30 and the QR rotates every ~30s = 15-minute window)
      QRCODE_LIMIT: "500"
      # database (required in v2)
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      # cache
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution-cache
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "true"
      # global webhook -> bridge
      WEBHOOK_GLOBAL_URL: http://192.168.15.100:8097/webhook/whatsapp
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    depends_on:
      - evolution-postgres
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:15
    container_name: wabridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution_api
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  evolution-redis:
    image: redis:latest
    container_name: wabridge-redis
    restart: unless-stopped
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
