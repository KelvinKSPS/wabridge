name: CI

# Testes e build a cada push. O runner do GitHub é x86_64, então não precisa
# do wrapper de aapt2/qemu (que só existe na Orange Pi ARM) — o build
# do APK sai em poucos minutos em vez de ~20 min na board.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  servidor:
    name: servidor (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: instala o ffmpeg (conversao opus <-> wav)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  daemon:
    name: daemon Go (motor do WhatsApp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedded-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: embedded-core/go.sum
      - name: testes do daemon
        run: go test ./...
      - name: build android/arm64
        run: |
          set -euo pipefail
          mkdir -p ../android-bridge/app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" \
            -o ../android-bridge/app/src/main/jniLibs/arm64-v8a/libwabridge_core.so .
          ls -lh "${{ github.workspace }}/android-bridge/app/src/main/jniLibs/arm64-v8a/libwabridge_core.so"
      - uses: actions/upload-artifact@v4
        with:
          name: wabridge-daemon
          path: android-bridge/app/src/main/jniLibs/arm64-v8a/libwabridge_core.so
          retention-days: 14

  android:
    name: android (Kotlin)
    runs-on: ubuntu-latest
    needs: [daemon]
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
      - name: pega o daemon compilado
        uses: actions/download-artifact@v4
        with:
          name: wabridge-daemon
          path: ${{ github.workspace }}/android-bridge/app/src/main/jniLibs/arm64-v8a
      - name: testes unitarios
        run: ./gradlew testDebugUnitTest --console=plain
      - name: build do APK de debug
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: release assinada
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [servidor, daemon, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: pega o daemon compilado
        uses: actions/download-artifact@v4
        with:
          name: wabridge-daemon
          path: ${{ github.workspace }}/android-bridge/app/src/main/jniLibs/arm64-v8a
      - name: confere se o daemon foi embutido
        run: |
          set -euo pipefail
          ls -lh "${{ github.workspace }}/android-bridge/app/src/main/jniLibs/arm64-v8a/libwabridge_core.so"
      - name: monta o keystore a partir do segredo
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 nao definido; release sem assinar (usa debug)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android-bridge/wabridge.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-bridge/wabridge.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: build do APK release
        run: ./gradlew assembleRelease --console=plain
      - name: confere a assinatura do APK
        run: |
          set -uo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk > /tmp/certs.txt
          rc=$?
          head -5 /tmp/certs.txt
          if [ $rc -ne 0 ]; then
            echo "::error::APK sem assinatura valida"
            exit 1
          fi
          "$BT/aapt2" dump badging \
            app/build/outputs/apk/release/app-release.apk > /tmp/badging.txt
          head -1 /tmp/badging.txt
      - name: publica na release
        uses: softprops/action-gh-release@v2
        with:
          files: android-bridge/app/build/outputs/apk/release/app-release.apk
