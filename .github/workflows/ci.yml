name: CI

# Testes e build a cada push. O runner do GitHub é x86_64, então não precisa
# do wrapper de aapt2 com qemu (que só existe na Orange Pi ARM) — o build
# do APK sai em poucos minutos em vez de ~20 min na board.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  servidor:
    name: servidor (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    name: android (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: testes unitarios
        run: ./gradlew testDebugUnitTest --console=plain
      - name: build do APK de debug
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: release assinada
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [servidor, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: monta o keystore a partir do segredo
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 nao definido; release sem assinar (usa debug)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android-bridge/wabridge.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-bridge/wabridge.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: build do APK release
        run: ./gradlew assembleRelease --console=plain
      - name: publica na release
        uses: softprops/action-gh-release@v2
        with:
          files: android-bridge/app/build/outputs/apk/release/app-release.apk
